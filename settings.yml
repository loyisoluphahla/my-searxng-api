# SearXNG configuration

use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "super_secret_key_change_me_in_production"
  real_ip_header: "X-Forwarded-For"
  num_proxies: 1

search:
  safe_search: 0
  autocomplete: ""

# Route all outgoing engine queries through the local Tor SOCKS proxy
proxies:
  all: socks5h://127.0.0.1:9050

# Optional: Tweak engines if needed
engines:
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
  - name: wikidata
    engine: wikidata
    shortcut: wd